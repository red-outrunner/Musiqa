name: Release builds

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev ffmpeg dbus-x11 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 pulseaudio
      - name: Start a virtual audio output for playback tests
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=musica_tests
          pactl set-default-sink musica_tests
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtmultimedia
          setup-python: false
          cache: true
      - uses: actions/cache@v4
        id: taglib
        with:
          path: ${{ runner.temp }}/taglib
          key: taglib-2.1.1-shared-ubuntu-22.04-x64
      - name: Build TagLib
        if: steps.taglib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2.1.1 https://github.com/taglib/taglib.git "$RUNNER_TEMP/taglib-source"
          cmake -S "$RUNNER_TEMP/taglib-source" -B "$RUNNER_TEMP/taglib-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BINDINGS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/taglib"
          cmake --build "$RUNNER_TEMP/taglib-build" --parallel 2
          cmake --install "$RUNNER_TEMP/taglib-build"
      - name: Configure
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/taglib"
      - name: Compile
        run: cmake --build build-linux --parallel 2
      - name: Test
        run: ctest --test-dir build-linux --output-on-failure
      - name: Package and smoke test
        run: bash packaging/linux/package.sh build-linux
      - uses: actions/upload-artifact@v4
        with:
          name: Musica-Linux-x64
          path: dist/Musica-*-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Linux-test-logs
          path: build-linux/Testing/Temporary/
          if-no-files-found: ignore

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/windows.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Musica-*
          path: release-assets
          merge-multiple: true
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/^project\(MusicPlayerApp VERSION / { print $3 }' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          test -n "$(find release-assets -name '*.zip' -print -quit)"
          test -n "$(find release-assets -name '*-linux-x86_64.tar.gz' -print -quit)"
          git archive --format=tar.gz --prefix="Musica-$version-source/" HEAD > "release-assets/Musica-$version-source.tar.gz"
          (cd release-assets && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Musica $version" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
