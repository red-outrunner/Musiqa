name: Windows build and package

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use system fonts for offscreen tests
        shell: pwsh
        run: '"QT_QPA_FONTDIR=$env:SystemRoot/Fonts" >> $env:GITHUB_ENV'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          setup-python: false
          cache: true
      - name: Install TagLib and test media tools
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          & "$env:VCPKG_ROOT/vcpkg.exe" install taglib:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Command ffmpeg, ffprobe -ErrorAction Stop | Out-Null
      - name: Configure
        run: cmake --preset windows-release
      - name: Compile
        id: compile
        run: cmake --build --preset windows-release --parallel 2
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build-windows --output-on-failure 2>&1 | Tee-Object -FilePath build-windows/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record dependency versions
        if: always() && steps.compile.outcome == 'success'
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" list | Out-File -Encoding utf8 build-windows/DEPENDENCY-VERSIONS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deploy Qt, QML and dependencies
        id: deploy
        if: always() && steps.compile.outcome == 'success'
        run: cmake --build build-windows --target windows-deploy
      - name: Check Open With scripts
        id: scripts
        if: always() && steps.deploy.outcome == 'success'
        shell: pwsh
        run: |
          foreach ($file in @('Register-OpenWith.ps1', 'Unregister-OpenWith.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "build-windows/windows-package/bin/$file"), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Smoke test the deployed folder without a development PATH
        id: smoke
        if: always() && steps.deploy.outcome == 'success'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $app = Start-Process -FilePath ./build-windows/windows-package/bin/musicplayer.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Deployed Musica failed ($($app.ExitCode))." }
      - name: Create zip
        id: package
        if: always() && steps.smoke.outcome == 'success' && steps.scripts.outcome == 'success'
        run: cpack --config build-windows/CPackConfig.cmake -C Release -B dist
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success'
        with:
          name: Musica-Windows-x64
          path: dist/Musica-*-windows-*.zip
          if-no-files-found: error
      - name: Summarize failures
        if: failure()
        run: node packaging/report-ci-errors.cjs build-windows/ctest.log build-windows/test-results build-windows/Testing/Temporary/LastTest.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-test-logs
          path: |
            build-windows/Testing/Temporary/
            build-windows/test-results/
            build-windows/ctest.log
          if-no-files-found: ignore
